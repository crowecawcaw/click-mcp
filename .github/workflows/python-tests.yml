name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.python-version }}${{ matrix.click-version != 'latest' && ', Click 7.0' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        click-version: ['latest']
        include:
          - python-version: '3.10'
            click-version: '7.0'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Install minimum supported Click
        if: matrix.click-version != 'latest'
        run: python -m pip install 'click==${{ matrix.click-version }}'
      - name: Run tests
        run: |
          pytest tests/
